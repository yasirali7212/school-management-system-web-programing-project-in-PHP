<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f66f6"/>
            <stop offset="100%" stop-color="#324bdc"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e7ff"/>
        </linearGradient>
        <filter id="floatShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
        </filter>
    </defs>
    <!-- Background Desk Platform -->
    <ellipse cx="200" cy="310" rx="170" ry="32" fill="#ffffff" fill-opacity="0.15"/>
    <ellipse cx="200" cy="305" rx="140" ry="24" fill="#ffffff" fill-opacity="0.25"/>

    <!-- Desk / Workspace Surface -->
    <rect x="70" y="275" width="260" height="14" rx="7" fill="#ffffff" filter="url(#floatShadow)"/>

    <!-- Open Laptop on Desk -->
    <rect x="140" y="195" width="120" height="80" rx="6" fill="#1e293b"/>
    <rect x="146" y="201" width="108" height="68" rx="4" fill="url(#screenGrad)"/>
    <!-- Dashboard chart preview on laptop screen -->
    <rect x="154" y="212" width="40" height="6" rx="2" fill="#3b82f6"/>
    <rect x="154" y="222" width="24" height="4" rx="2" fill="#93c5fd"/>
    <path d="M154 250 L174 238 L194 246 L214 230 L234 236 L244 225" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="125" y="274" width="150" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Educational Books Stack -->
    <rect x="85" y="255" width="48" height="10" rx="2" fill="#f59e0b"/>
    <rect x="87" y="244" width="44" height="11" rx="2" fill="#3b82f6"/>
    <rect x="84" y="234" width="50" height="10" rx="2" fill="#10b981"/>

    <!-- Cute Desk Plant -->
    <path d="M288 260 L292 275 L304 275 L308 260 Z" fill="#f97316"/>
    <circle cx="295" cy="254" r="8" fill="#22c55e"/>
    <circle cx="302" cy="250" r="7" fill="#16a34a"/>
    <circle cx="298" cy="245" r="7" fill="#4ade80"/>

    <!-- Character / Student Avatar -->
    <!-- Head -->
    <circle cx="200" cy="115" r="32" fill="#ffd1b3"/>
    <!-- Hair -->
    <path d="M168 115 C168 85 180 75 200 75 C220 75 232 85 232 115 C222 105 210 102 200 102 C190 102 178 105 168 115 Z" fill="#33241d"/>
    <!-- Glasses -->
    <circle cx="190" cy="118" r="9" stroke="#1e293b" stroke-width="2.5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="210" cy="118" r="9" stroke="#1e293b" stroke-width="2.5" fill="#ffffff" fill-opacity="0.3"/>
    <line x1="199" y1="118" x2="201" y2="118" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Friendly Smile -->
    <path d="M194 132 Q200 137 206 132" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Body / Hoodie -->
    <path d="M165 152 C175 145 187 142 200 142 C213 142 225 145 235 152 L248 200 L152 200 Z" fill="#2563eb"/>
    <path d="M192 143 L195 175 L200 185 L205 175 L208 143" fill="#ffffff"/>

    <!-- Floating Achievement Badges -->
    <g transform="translate(60, 90)">
        <circle cx="20" cy="20" r="20" fill="#ffffff" fill-opacity="0.2" filter="url(#floatShadow)"/>
        <text x="20" y="27" font-size="20" text-anchor="middle">🎓</text>
    </g>
    <g transform="translate(300, 110)">
        <circle cx="20" cy="20" r="20" fill="#ffffff" fill-opacity="0.2" filter="url(#floatShadow)"/>
        <text x="20" y="27" font-size="20" text-anchor="middle">⭐</text>
    </g>
</svg>

