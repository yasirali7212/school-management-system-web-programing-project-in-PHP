<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd34d"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
        </filter>
    </defs>
    <!-- Crest Shield Body -->
    <path d="M60 8 C88 8 104 20 104 42 C104 78 60 108 60 108 C60 108 16 78 16 42 C16 20 32 8 60 8 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
    <!-- Outer Golden Accent Border -->
    <path d="M60 12 C85 12 100 23 100 42 C100 74 60 102 60 102 C60 102 20 74 20 42 C20 23 35 12 60 12 Z" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>
    <!-- Central Knowledge Torch / Crown -->
    <path d="M60 20 L63 27 L70 27 L64 32 L66 39 L60 35 L54 39 L56 32 L50 27 L57 27 Z" fill="url(#goldGrad)"/>
    <!-- Prominent "R" Monogram for Roots -->
    <text x="60" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">R</text>
    <!-- Open Book Foundation -->
    <path d="M60 76 C53 71 40 72 36 75 L36 89 C40 86 53 85 60 90 C67 85 80 86 84 89 L84 75 C80 72 67 71 60 76 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M60 76 L60 90" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
    <!-- Academic Laurel Wreath -->
    <path d="M34 46 C29 55 30 68 36 76" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M86 46 C91 55 90 68 84 76" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
